name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的 tag，例如 v1.2.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish distribution zip
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "非法 tag：$TAG"
            exit 1
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - name: Toolchain
        run: swift --version && sw_vers

      - name: Self test
        run: swift run GitGlassSelfTest | tee selftest.log

      - name: Assert zero failures
        run: grep -q "0 失败" selftest.log

      - name: Build app and distribution zip
        run: |
          chmod +x scripts/build-app.sh scripts/package.sh
          ./scripts/build-app.sh
          ./scripts/package.sh

      - name: Verify artifacts
        run: |
          test -x dist/GitGlass.app/Contents/MacOS/GitGlass
          ls -lh dist/*.zip
          unzip -t dist/*.zip | tail -1

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip \
              --title "GitGlass $TAG" \
              --generate-notes
          fi
          echo "已发布 $TAG"
