name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的 tag，例如 v1.2.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish distribution zip
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "非法 tag：$TAG"
            exit 1
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - name: Toolchain
        run: swift --version && sw_vers

      - name: Self test
        run: swift run GitGlassSelfTest | tee selftest.log

      - name: Assert zero failures
        run: grep -q "0 失败" selftest.log

      - name: Build app and distribution zip
        run: |
          chmod +x scripts/build-app.sh scripts/package.sh
          ./scripts/build-app.sh
          ./scripts/package.sh

      - name: Verify artifacts
        run: |
          test -x dist/GitGlass.app/Contents/MacOS/GitGlass
          ls -lh dist/*.zip
          unzip -t dist/*.zip | tail -1

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -x
          echo "GITHUB_REF_NAME=$GITHUB_REF_NAME TAG=$TAG"
          gh auth status || true
          NOTES="$(printf '码牛 MooGit %s\n\n主要更新见 CHANGELOG.md。' "$TAG")"
          gh release create "$TAG" dist/*.zip \
            --title "码牛 MooGit $TAG" \
            --notes "$NOTES" \
            --verify-tag 2>&1 | tee release-create.log || {
              echo "exit=$? —— create 失败或已存在"
              cat release-create.log
              gh release view "$TAG" && gh release upload "$TAG" dist/*.zip --clobber
            }
          gh release view "$TAG" --json tagName,isDraft,assets 2>&1 | tee release-view.log
          echo "已发布 $TAG"
